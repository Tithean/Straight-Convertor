services:
  backend:
    build: ./backend
    init: true
    environment:
      MAX_UPLOAD_MB: 20
      CONVERSION_TIMEOUT_SECONDS: 120
      MAX_CONCURRENT_CONVERSIONS: 2
      MAX_PDF_PAGES: 100
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
      - /home/converter:size=64m,mode=1777
    mem_limit: 1536m
    cpus: 2
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8000/api/health')); assert d['engines']['office']"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
